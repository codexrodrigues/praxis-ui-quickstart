name: Deploy Production
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quickstart-production
  cancel-in-progress: false
jobs:
  configuration:
    name: Check deployment configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.configuration.outputs.ready }}
    steps:
      - name: Require the release branch
        run: test "$GITHUB_REF" = refs/heads/main
      - id: configuration
        name: Verify Workload Identity Federation variables
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "$WORKLOAD_IDENTITY_PROVIDER" || -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "::error::Configure GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT before releasing."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
    timeout-minutes: 3
  validate:
    needs: configuration
    uses: ./.github/workflows/ci.yml
  deploy:
    name: Deploy Firebase Hosting and validate the public manifest
    needs:
      - configuration
      - validate
    if: needs.configuration.outputs.ready == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://praxis-ui-4e602.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Download validated production artifact
        uses: actions/download-artifact@v8
        with:
          name: production-${{ github.sha }}
          path: dist/praxis-ui-quickstart/browser
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Validate official host contract
        run: npm run validate:official-host
      - name: Resolve expected Praxis UI train
        id: expected-train
        shell: bash
        run: |
          train=$(node -p "require('./public/examples.manifest.json').packageTrain")
          echo "value=$train" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: praxis-ui-4e602
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Verify and prepare artifact-only Firebase deployment
        run: node tools/release-artifact.mjs firebase-config
      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@14.27.0 deploy --config .firebase.release.json --only hosting --project praxis-ui-4e602
          --non-interactive
      - name: Validate published example inventory
        env:
          HOSTED_QUICKSTART_URL: https://praxis-ui-4e602.web.app
          EXPECTED_PRAXIS_TRAIN: ${{ steps.expected-train.outputs.value }}
        run: npm run validate:hosted-manifest

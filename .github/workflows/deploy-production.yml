name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickstart-production
  cancel-in-progress: false

jobs:
  configuration:
    name: Check deployment configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.configuration.outputs.ready }}
    steps:
      - id: configuration
        name: Verify Workload Identity Federation variables
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [[ -n "$WORKLOAD_IDENTITY_PROVIDER" && -n "$DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Configure GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT before deploying."
            exit 1
          fi

          echo "::notice::Production deploy skipped until Workload Identity Federation variables are configured."

  deploy:
    name: Deploy Firebase Hosting and validate the public manifest
    needs: configuration
    if: >-
      needs.configuration.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://praxis-ui-4e602.web.app
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve deploy revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "sha=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout validated revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate official host contract
        run: npm run validate:official-host

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: praxis-ui-4e602
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting
        # firebase-tools v15 currently times out while resolving ADC backed by
        # Workload Identity Federation (firebase/firebase-tools#10726).
        # Keep this keyless-compatible pin until the upstream fix is released.
        run: npx --yes firebase-tools@14.27.0 deploy --only hosting --project praxis-ui-4e602 --non-interactive

      - name: Validate published example inventory
        env:
          HOSTED_QUICKSTART_URL: https://praxis-ui-4e602.web.app
          EXPECTED_PRAXIS_TRAIN: 9.0.5-rc.10
        run: npm run validate:hosted-manifest
